<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in — Cold Email Sequencer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script>document.body.classList.toggle('light-mode', localStorage.getItem('theme') === 'light');</script>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand-s">S</div>
      <h1>Cold Email Sequencer</h1>
      <p class="muted" style="margin-bottom:1.5rem">Sign in with your Scale Army Google account.</p>
      <a class="btn" id="google-login-btn" href="/api/auth/google_login" style="width:100%; justify-content:center">
        Sign in with Google
      </a>
      <div class="error" id="error" style="display:none"></div>
    </div>
  </div>
  <script>
    const ERROR_MESSAGES = {
      oauth_failed: "Could not complete Google sign-in. Please try again.",
      invalid_state: "That sign-in link expired. Please try again.",
      domain_not_allowed: "Only Scale Army Google accounts can access this tool.",
    };

    const params = new URLSearchParams(window.location.search);
    const sessionToken = params.get("session_token");
    if (sessionToken) {
      // Arriving back from /api/auth/google_callback's redirect - stash the
      // session token (used as the X-Auth-Token header from here on, same
      // spot the old password lived) and drop into the app.
      localStorage.setItem("auth_token", sessionToken);
      const email = params.get("email");
      if (email) localStorage.setItem("user_email", email);
      window.location.href = "/index.html";
    } else if (params.get("error")) {
      const errorEl = document.getElementById("error");
      errorEl.textContent = ERROR_MESSAGES[params.get("error")] || "Something went wrong signing in.";
      errorEl.style.display = "block";
    }
  </script>
</body>
</html>
