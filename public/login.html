<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in — Cold Email Sequencer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script>document.body.classList.toggle('light-mode', localStorage.getItem('theme') === 'light');</script>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand-s">S</div>
      <h1>Cold Email Sequencer</h1>
      <form id="login-form">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autofocus required>
        </div>
        <button class="btn" type="submit" style="width:100%">Log in</button>
        <div class="error" id="error" style="display:none"></div>
      </form>
    </div>
  </div>
  <script>
    // Deliberately not using the shared api() helper here: it auto-redirects
    // to this same page on a 401, which would just silently reload this
    // form before a failed attempt could ever be shown.
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.style.display = "none";
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/auth/login", { headers: { "X-Auth-Token": password } });
        if (!res.ok) {
          errorEl.textContent = "Incorrect password.";
          errorEl.style.display = "block";
          return;
        }
        localStorage.setItem("auth_token", password);
        window.location.href = "/index.html";
      } catch (err) {
        errorEl.textContent = "Could not reach the server. Please try again.";
        errorEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
